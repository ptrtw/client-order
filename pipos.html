function RG(){var g=document.getElementById('taste-grid');if(!g)return;g.innerHTML='';if(!currentItem)return;var c=currentItem;var grid=[["去冰","無糖","1分糖","全部"],["微冰","微糖","3分糖","小碎冰"],["少冰","半糖","4分糖","常溫"],["正常冰","少糖","6分糖","溫飲"],["多冰","多糖","7分糖","熱飲"]];grid.forEach(function(row){row.forEach(function(cell){var btn=document.createElement('button');btn.textContent=cell;var isActive=(cell===c.ice||cell===c.sugar);if(isActive)btn.className='active';btn.onclick=function(){var ices=["去冰","微冰","少冰","正常冰","多冰","全部","小碎冰","常溫","溫飲","熱飲"];var sugars=["無糖","微糖","半糖","少糖","全糖","多糖","1分糖","3分糖","4分糖","6分糖","7分糖","8分糖"];if(ices.indexOf(cell)>=0)c.ice=cell;else if(sugars.indexOf(cell)>=0)c.sugar=cell;RG();RE()};g.appendChild(btn)})})}
function toggleSize(){if(!currentItem)return;var sz=Object.keys(currentItem.item.prices);var i=sz.indexOf(currentItem.size);currentItem.size=sz[(i+1)%sz.length];currentItem.toppings=[];recalc();R()}
function recalc(){if(!currentItem)return;var base=currentItem.item.prices[currentItem.size]||0;var tm=toppingPrices[currentItem.size]||{};if(currentItem.item.customToppings&&currentItem.item.customToppings[currentItem.size])tm=currentItem.item.customToppings[currentItem.size];var tc=currentItem.toppings.reduce(function(s,t){return s+(tm[t]||0)},0);currentItem.price=(base+tc)*currentItem.qty}
function numInput(n){if(!currentItem)return;currentItem.qty=Math.min(99,n);recalc();RE()}
function cancelEdit(){currentItem=null;R()}
function addToCart(){if(!currentItem)return;cart.push({item:currentItem.item,size:currentItem.size,ice:currentItem.ice,sugar:currentItem.sugar,toppings:currentItem.toppings.slice(),teaSwap:currentItem.teaSwap,note:currentItem.note,qty:currentItem.qty,price:currentItem.price});currentItem=null;R()}
function RO(){var t=document.getElementById('cart-body');if(cart.length===0){t.innerHTML='<tr><td colspan="8" style="color:#999;padding:16px;">尚未點餐 — 點選右側飲料開始</td></tr>'}else{t.innerHTML=cart.map(function(c,i){var tp=c.toppings.length?c.toppings.join('、'):'';return'<tr><td style="text-align:left;padding-left:4px;">'+c.item.name+'</td><td>'+c.size+'</td><td></td><td>'+(c.ice||'-')+'/'+(c.sugar||'-')+'</td><td>'+(tp||'')+'</td><td>'+c.qty+'</td><td>'+Math.round(c.price/c.qty)+'</td><td style="font-weight:bold;">'+c.price+'</td></tr>'}).join('')}US()}
function US(){var cups=cart.reduce(function(s,c){return s+c.qty},0),total=cart.reduce(function(s,c){return s+c.price},0);if(applyGift){var ac=[];cart.forEach(function(c){for(var i=0;i<c.qty;i++)ac.push(c.price/c.qty)});ac.sort(function(a,b){return a-b});var d=0;for(var i=5;i<ac.length;i+=6)d+=ac[i];total=Math.max(0,total-d)}document.getElementById('cup-count').textContent=cups;document.getElementById('total-amt').textContent=total;document.getElementById('top-cart').textContent='🛒 '+cups+' 杯 | $'+total}

function saveCustomerInfo(){customerInfo.phone=document.getElementById('cust-phone').value.trim();customerInfo.address=document.getElementById('cust-address').value.trim();customerInfo.note=document.getElementById('cust-note').value.trim();document.getElementById('customer-modal').style.display='none'}
function submitOrder(){if(cart.length===0)return alert('尚未點餐！');if(!customerInfo.phone||customerInfo.phone.replace(/\D/g,'').length!==10){openCustomerModal();return alert('請先填寫聯絡電話！')}var total=cart.reduce(function(s,c){return s+c.price},0);if(applyGift){var ac=[];cart.forEach(function(c){for(var i=0;i<c.qty;i++)ac.push(c.price/c.qty)});ac.sort(function(a,b){return a-b});var d=0;for(var i=5;i<ac.length;i+=6)d+=ac[i];total=Math.max(0,total-d)}var od={orderId:Date.now().toString(),phone:customerInfo.phone,method:customerInfo.address?'外送':'自取',address:customerInfo.address,note:customerInfo.note,payMethod:'現金',finalTotal:total,cartItems:JSON.parse(JSON.stringify(cart)),source:'pi'};fetch(G,{method:'POST',body:JSON.stringify(od)}).then(function(r){return r.json()}).then(function(res){if(res.status==='success'){alert('✅ 訂單已送出！合計 $'+total);cart=[];currentItem=null;applyGift=false;customerInfo={phone:'',address:'',note:''};document.getElementById('gift-btn').classList.remove('active-gift');R()}else alert('❌ 送單失敗')}).catch(function(){alert('❌ 網路錯誤')})}
